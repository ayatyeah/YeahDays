name: Production backup and restore
on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: postgres:18
    services:
      restore:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: local_restore_only
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install encryption tool
        run: apt-get update -qq && apt-get install -y --no-install-recommends gnupg
      - name: Back up, encrypt and verify recovery
        shell: bash
        run: scripts/backup-production.sh
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          RESTORE_HOST: restore
          RESTORE_USER: postgres
          RESTORE_PASSWORD: local_restore_only
      - name: Store only encrypted backup and verification
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-database-${{ github.run_id }}
          path: |
            artifacts/backup/*.gpg
            artifacts/backup/*.sha256
            artifacts/backup/verification.json
          retention-days: 14
          if-no-files-found: error
