name: LMS calendar sync

# Дедлайны Moodle обновляются три раза в день: 08:00 / 16:00 / 22:00
# по Алматы (UTC+5). Отдельно от hourly fallback уведомлений ordinary-push.yml.
on:
  schedule:
    - cron: "0 3,11,17 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pull deadlines from LMS calendar
        run: |
          curl --fail --silent --show-error --max-time 90 -X POST "https://yeahgrind.site/api/cron/lms-sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
