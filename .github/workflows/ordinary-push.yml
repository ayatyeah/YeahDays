name: Push notifications cron

# Economy mode: the in-process minute timer is disabled so Railway can sleep.
# This hourly job wakes the service; GitHub may delay scheduled runs.
# Dispatch remains idempotent. Exact-minute reminders are not guaranteed.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Morning/evening digest (hourly-ish, cheap to call every run)
        run: |
          curl --fail --silent --show-error --max-time 90 -X POST "https://yeahgrind.site/api/push/send" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Scheduled task/todo reminders
        run: |
          curl --fail --silent --show-error --max-time 90 -X POST "https://yeahgrind.site/api/push/dispatch" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
