name: Research retention backup

# The persistent server checks hourly. This is an independent daily backup.
# Legacy personalized push reminders are suspended during the A/B comparison.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete expired research records
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 60 -X POST \
            "https://yeahgrind.site/api/research/retention" \
            -H "Authorization: Bearer $CRON_SECRET"
