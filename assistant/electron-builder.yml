appId: com.yeahdays.didi
productName: DiDi
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - wakeword/**/*
  - package.json
# Нативный аддон (микрофон) и Python-скрипт локального детектора не могут
# жить внутри .asar — оба должны быть распакованы рядом: dlopen на .node
# внутри архива падает, а python.exe вообще не умеет читать виртуальную
# asar-файловую систему, ему нужен настоящий путь на диске.
asarUnpack:
  - '**/*.node'
  - 'wakeword/**/*'
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: always
